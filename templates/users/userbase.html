{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microplastics: The Hidden Pollution</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/styles.css' %}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
        }

        /* Sidebar Styling */
        nav {
            width: 220px;
            background: linear-gradient(135deg, rgba(30, 60, 114, 0.8) 0%, rgba(42, 82, 152, 0.8) 100%);
            padding: 30px 20px;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            animation: fadeInUp 1s ease-out;
        }

        nav h1 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            text-align: center;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        nav ul {
            list-style: none;
            padding: 0;
            width: 100%;
        }

        nav ul li {
            width: 100%;
        }

        nav ul li a {
            display: block;
            padding: 12px 30px;
            color: #fff;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        nav ul li a:hover,
        nav ul li a.active {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            border-left: 4px solid #fff;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        /* Content Area */
        .main-content {
            flex-grow: 1;
            margin-left: 240px;
            padding: 20px;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            nav {
                width: 180px;
            }
            .main-content {
                margin-left: 200px;
                padding: 15px;
            }
            nav h1 {
                font-size: 1.5rem;
            }
            nav ul li a {
                font-size: 1rem;
                padding: 10px 20px;
            }
        }

        @media (max-width: 480px) {
            nav {
                width: 100%;
                height: auto;
                position: relative;
                padding: 15px;
            }
            .main-content {
                margin-left: 0;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <h1>Microplastics: The Hidden Pollution</h1>
        <ul>
            <li><a href="{% url 'UserHome' %}" class="{% if request.resolver_match.url_name == 'UserHome' %}active{% endif %}">Home</a></li>
            <li><a href="{% url 'upload_image' %}" class="{% if request.resolver_match.url_name == 'upload_image' %}active{% endif %}">Upload Image</a></li>
            <li><a href="{% url 'index' %}" class="{% if request.resolver_match.url_name == 'index' %}active{% endif %}">Logout</a></li>
        </ul>
    </nav>

    <div class="main-content">
        {% block contents %}
        {% endblock %}
    </div>
</body>
</html>
