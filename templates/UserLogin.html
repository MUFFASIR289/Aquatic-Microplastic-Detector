{% extends 'base.html' %}
{% load static %}
{% block contents %}
<style>
    /* Container for the login form */
    .login-container {
        max-width: 400px;
        background: rgba(96, 96, 244, 0.95);
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        padding: 30px;
        margin: 50px auto;
        animation: fadeInUp 1s ease-out;
    }

    /* Heading style to match index.html */
    .user-login-heading {
        margin-bottom: 20px;
        text-align: center;
        font-size: 2.5rem;
        color: white;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Form group and label styling */
    .form-group label {
        font-weight: bold;
        color: #333;
    }

    /* Input fields */
    .form-control {
        border-radius: 5px;
        border: 1px solid #ced4da;
        transition: all 0.3s ease;
    }

    .form-control:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
    }

    /* Button styling to match index.html */
    .btn-login {
        background: linear-gradient(45deg, #ff6b6b, #ee5a24);
        border: none;
        color: white;
        padding: 12px 24px;
        border-radius: 50px;
        font-size: 1.1rem;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .btn-login:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    /* Message alerts */
    .alert {
        border-radius: 10px;
        margin-top: 20px;
        text-align: center;
        padding: 10px;
    }

    .alert-success {
        background: rgba(200, 255, 200, 0.8);
        color: #333;
    }

    .alert-error {
        background: rgba(255, 200, 200, 0.8);
        color: #333;
    }

    /* Animation from index.html */
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Responsive design */
    @media (max-width: 768px) {
        .login-container {
            max-width: 90%;
            padding: 20px;
        }
        .user-login-heading {
            font-size: 2rem;
        }
    }
</style>

<section class="content">
    <div class="login-container">
        <div class="we-do-details">
            <div class="section-header text-center">
                <h2 class="user-login-heading">User Login</h2>
                <form action="{% url 'UserLoginCheck' %}" method="POST" style="width: 100%">
                    {% csrf_token %}
                    <div class="form-group">
                        <input type="text" class="form-control" name="loginid" required placeholder="Enter Login ID">
                    </div>
                    <div class="form-group">
                        <input type="password" class="form-control" name="pswd" required placeholder="Enter Password">
                    </div>
                    <div class="form-group text-center">
                        <button class="btn-login" type="submit">
                            Login
                        </button>
                    </div>
                    
                    {% if messages %}
                    {% for message in messages %}
                    <div class="alert {% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %}">
                        {{ message }}
                    </div>
                    {% endfor %}
                    {% endif %}
                </form>
            </div><!--/.section-header-->
        </div><!--/.we-do-details-->
    </div><!--/.login-container-->
</section>
{% endblock %}
