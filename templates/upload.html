{% extends 'users/userbase.html' %}
{% load static %}

{% block contents %}
<style>
    /* Container for the upload form */
    .upload-container {
        max-width: 500px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        padding: 30px;
        margin: 50px auto;
        animation: fadeInUp 1s ease-out;
    }

    /* Heading style to match userbase.html */
    .upload-heading {
        font-size: 2.5rem;
        text-align: center;
        color: white;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin-bottom: 20px;
    }

    /* Form group and label styling */
    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        font-weight: bold;
        color: #333;
        display: block;
        margin-bottom: 10px;
    }

    /* File input styling */
    .form-control-file {
        width: 100%;
        padding: 10px;
        border: 1px solid #ced4da;
        border-radius: 5px;
        transition: all 0.3s ease;
    }

    .form-control-file:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        outline: none;
    }

    /* Button styling to match userbase.html */
    .btn-upload {
        background: linear-gradient(45deg, #ff6b6b, #ee5a24);
        border: none;
        color: white;
        padding: 12px 24px;
        border-radius: 50px;
        font-size: 1.1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        width: 100%;
    }

    .btn-upload:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    /* Message alerts */
    .alert {
        border-radius: 10px;
        margin-top: 20px;
        text-align: center;
        padding: 10px;
    }

    .alert-success {
        background: rgba(200, 255, 200, 0.8);
        color: #333;
    }

    .alert-error {
        background: rgba(255, 200, 200, 0.8);
        color: #333;
    }

    /* Animation from userbase.html */
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Responsive design */
    @media (max-width: 768px) {
        .upload-container {
            max-width: 90%;
            padding: 20px;
        }
        .upload-heading {
            font-size: 2rem;
        }
    }
</style>

<div class="main-content">
    <div class="upload-container">
        <h1 class="upload-heading">Upload an Image</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label for="image">Select Image to Upload</label>
                <input type="file" name="image" class="form-control-file" id="image" accept="image/*" required>
            </div>
            <div class="form-group">
                <button type="submit" class="btn-upload">Upload</button>
            </div>
            
            {% if messages %}
            {% for message in messages %}
            <div class="alert {% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}
        </form>
    </div>
</div>
{% endblock %}
