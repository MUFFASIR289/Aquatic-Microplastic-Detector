{% extends 'base.html' %}
{% load static %}
{% block contents %}
<style>
    /* Container for the registration form */
    .register-container {
        max-width: 500px;
        background: rgba(88, 138, 239, 0.95);
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        padding: 30px;
        margin: 50px auto;
        animation: fadeInUp 1s ease-out;
    }

    /* Heading style */
    .register-heading {
        font-size: 2.5rem;
        text-align: center;
        color: white;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin-bottom: 30px;
    }

    /* Form group and label styling */
    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        font-weight: bold;
        color: #333;
        display: block;
        margin-bottom: 10px;
    }

    /* Input and textarea styling */
    .form-control {
        width: 100%;
        padding: 10px;
        border: 1px solid #ced4da;
        border-radius: 5px;
        transition: all 0.3s ease;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .form-control:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        outline: none;
    }

    textarea.form-control {
        resize: none;
        rows: 4;
    }

    /* Button styling */
    .btn-register {
        background: linear-gradient(45deg, #ff6b6b, #ee5a24);
        border: none;
        color: white;
        padding: 12px 24px;
        border-radius: 50px;
        font-size: 1.1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        width: 100%;
    }

    .btn-register:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    /* Message alerts */
    .alert {
        border-radius: 10px;
        margin-bottom: 20px;
        text-align: center;
        padding: 10px;
    }

    .alert-success {
        background: rgba(200, 255, 200, 0.8);
        color: #333;
    }

    .alert-error {
        background: rgba(255, 200, 200, 0.8);
        color: #333;
    }

    /* Animation */
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Responsive design */
    @media (max-width: 768px) {
        .register-container {
            max-width: 90%;
            padding: 20px;
        }
        .register-heading {
            font-size: 2rem;
        }
    }
</style>

<div class="content">
    <div class="register-container">
        <h2 class="register-heading">Register Here</h2>
        
        {% if messages %}
        {% for message in messages %}
        <div class="alert {% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        
        <form action="{% url 'UserRegisterForm' %}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" class="form-control" id="name" name="name" maxlength="100" required>
            </div>
            <div class="form-group">
                <label for="loginid">Login ID:</label>
                <input type="text" class="form-control" id="loginid" name="loginid" maxlength="100" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" class="form-control" id="password" name="password" maxlength="100" required>
            </div>
            <div class="form-group">
                <label for="mobile">Mobile:</label>
                <input type="text" class="form-control" id="mobile" name="mobile" maxlength="10" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" class="form-control" id="email" name="email" maxlength="100" required>
            </div>
            <div class="form-group">
                <label for="locality">Locality:</label>
                <input type="text" class="form-control" id="locality" name="locality" maxlength="100">
            </div>
            <div class="form-group">
                <label for="address">Address:</label>
                <textarea class="form-control" id="address" name="address" maxlength="1000"></textarea>
            </div>
            <div class="form-group">
                <label for="city">City:</label>
                <input type="text" class="form-control" id="city" name="city" maxlength="100">
            </div>
            <div class="form-group">
                <label for="state">State:</label>
                <input type="text" class="form-control" id="state" name="state" maxlength="100">
            </div>
            <div class="form-group">
                <button type="submit" class="btn-register">Register</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
